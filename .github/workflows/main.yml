name: Tezkor OAK e'lonlar

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      ids:
        description: "Qo'lda yuborish: e'lon raqamlari (masalan 32715 yoki u920572). Bo'sh qoldirsangiz — barcha yangi e'lonlar tekshiriladi."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: oak-bot
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1                # faqat oxirgi holat — tezroq
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"                  # kutubxonalar keshdan olinadi
      - run: pip install -r requirements.txt
      - name: Yangi e'lonlarni yuborish
        run: python bot.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_IDS: ${{ github.event.inputs.ids }}
          MAX_POSTS_PER_RUN: "100"
          ADMIN_IDS: ${{ vars.ADMIN_IDS }}
      - name: Holatni saqlash
        if: always()
        run: |
          git config user.name "oak-bot"
          git config user.email "oak-bot@users.noreply.github.com"
          git add state.json || true
          if ! git diff --cached --quiet; then
            git commit -m "state yangilandi"
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              sleep 5
            done
          fi
