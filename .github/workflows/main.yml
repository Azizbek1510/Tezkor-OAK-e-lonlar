name: Tezkor OAK e'lonlar

on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # har 15 daqiqada (GitHub band bo'lmagan daqiqalarda)
  workflow_dispatch:          # qo'lda ishga tushirish tugmasi
    inputs:
      ids:
        description: "Qo'lda yuborish: e'lon raqamlari (masalan 32715 yoki 32715,32716). Bo'sh qoldirsangiz — barcha yangi e'lonlar tekshiriladi."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: oak-bot
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main          # navbatda kutgan ishga tushirish ham ENG OXIRGI state.json ni olsin (takror postlarga qarshi)
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Yangi e'lonlarni yuborish
        run: python bot.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          FORCE_IDS: ${{ github.event.inputs.ids }}
          MAX_POSTS_PER_RUN: "100"
          ADMIN_IDS: ${{ vars.ADMIN_IDS }}
          DATA_KEY: ${{ secrets.DATA_KEY }}
      - name: Holatni saqlash
        if: always()
        run: |
          git config user.name "oak-bot"
          git config user.email "oak-bot@users.noreply.github.com"
          git add state.json || true
          if ! git diff --cached --quiet; then
            git commit -m "state yangilandi"
            for i in 1 2 3; do
              # boshqa fayl o'zgargan bo'lsa ham holat albatta saqlansin (state.json da bu ishga tushirish ustun)
              git pull --rebase -X theirs origin main && git push && break
              git rebase --abort 2>/dev/null || true
              sleep 5
            done
          fi
